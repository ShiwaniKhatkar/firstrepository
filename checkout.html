<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Checkout</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Delivery Details</h2>

<input id="name" placeholder="Full Name"><br><br>
<input id="email" placeholder="Email"><br><br>
<input id="phone" placeholder="Phone"><br><br>
<input id="address" placeholder="Address"><br><br>
<h2>Payment Method</h2>

<label>
  <input type="radio" name="payment" value="COD" checked onclick="togglePayment()"> Cash on Delivery
</label><br>

<label>
  <input type="radio" name="payment" value="UPI" onclick="togglePayment()"> UPI Payment
</label>

<div id="upi-section" style="display:none; margin-top:15px;">
  <p>Scan & Pay:</p>

  <img src="upi.png" width="200"><br><br>
<h3 id="upi-amount"></h3>

  <input id="upiId" placeholder="Enter UPI ID used For PAYMENT"><br><br>

  <button onclick="confirmUPIPayment()">I have Paid</button>
</div>

<h2>Your Order</h2>

<div id="order-items"></div>

<h3 id="order-total"></h3>

<button onclick="handleOrder()">Place Order</button>

<script src="script.js"></script>

<script>
displayOrder();
</script>

</body>
</html>
